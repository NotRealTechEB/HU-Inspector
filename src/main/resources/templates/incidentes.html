<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DGAC - Gestión de Incidentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Incidentes Reportados</h1>
        <a href="/" class="btn btn-secondary">Volver al Inicio</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Descripción</th>
                        <th>Quién reporta</th>
                        <th>Fecha</th>
                        <th>Región</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inc : ${listaIncidentes}">
                        <td th:text="${inc.Id}">1</td>
                        <td th:text="${inc.tipo.tipo}">Tipo</td>
                        <td th:text="${inc.descripcion}">Desc</td>
                        <td th:text="${inc.quien}">Usuario</td>
                        <td th:text="${#temporals.format(inc.fecha_reporte, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                        <td th:text="${inc.region}">Región</td>
                        <td>
                            <span th:if="${inc.resuelto}" class="badge bg-success">Resuelto</span>
                            <span th:unless="${inc.resuelto}" class="badge bg-danger">Pendiente</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
