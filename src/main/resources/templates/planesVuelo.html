<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DGAC - Panel de Inspección</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="alert alert-info shadow-sm" th:if="${dtoInsoector != null}">
        <h4 class="alert-heading">Inspector: <span th:text="${dtoInsoector.nombre} + ' ' + ${dtoInsoector.apellido}"></span></h4>
    </div>

    <div class="card shadow-sm mt-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Planes de Vuelo Pendientes/Activos</h5>
        </div>
        <div class="card-body">
            
            <div th:if="${planesVuelo == null or #lists.isEmpty(planesVuelo)}" class="alert alert-warning">
                <strong>Atención:</strong> No se encontraron planes de vuelo. 
                <br>Verifica si el servicio `servicio2.listar()` está retornando datos.
            </div>

            <table class="table table-hover" th:if="${planesVuelo != null and !#lists.isEmpty(planesVuelo)}">
                <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Región</th>
                        <th>Fecha</th>
                        <th>Altura Máx</th>
                        <th>RutPiloto</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="plan : ${planesVuelo}">
                        <td th:text="${plan.codigoVuelo}"></td>
                        <td th:text="${plan.region}"></td>
                        <td th:text="${#temporals.format(plan.fechaPV, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${plan.altMax} + ' m'"></td>
                        <td th:text="${plan.rutPiloto}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${plan.estadoPV}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
